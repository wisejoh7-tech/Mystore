{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete | MyStore{% endblock %}

{% block head_extra %}
<link rel="stylesheet" href="{% static 'css/user_auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-page-container">
    <div class="premium-auth-card">
        <div class="auth-header">
            <h2>Password Reset Complete</h2>
            <p>Your password has been set. You may now log in with your new password.</p>
        </div>

        <div class="auth-footer" style="margin-top: 20px;">
            <a href="{% url 'login' %}" class="btn-premium-auth" style="display: block; text-align: center; text-decoration: none;">Log In Now</a>
        </div>
    </div>
</div>
{% endblock %}
