services:
  # 1. Main Web Service
  - type: web
    name: drop-web
    env: docker
    region: oregon
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: drop.settings
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: drop-db
          property: internalConnectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: drop-redis
          property: connectionString
      - fromGroup: drop-secrets

  # 2. Celery Worker
  - type: worker
    name: drop-worker
    env: docker
    region: oregon
    plan: free
    startCommand: "celery -A drop worker -l info"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: drop.settings
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: drop-db
          property: internalConnectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: drop-redis
          property: connectionString
      - fromGroup: drop-secrets

# 3. PostgreSQL Database
databases:
  - name: drop-db
    plan: free
    region: oregon

# 4. Managed Redis
redis:
  name: drop-redis
  plan: free
  region: oregon

# 5. Shared Secrets
envVarGroups:
  - name: drop-secrets
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
      - key: PAYSTACK_SECRET_KEY
      - key: ADMIN_EMAIL
      - key: SITE_URL
      - key: EMAIL_HOST_USER
      - key: EMAIL_HOST_PASSWORD
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: GOOGLE_CLIENT_ID
      - key: GOOGLE_CLIENT_SECRET
      - key: PAYSTACK_PUBLIC_KEY
      - key: PAYSTACK_LIVE_MODE
        value: "False"
      - key: RESEND_API_KEY
      - key: SENTRY_DSN
